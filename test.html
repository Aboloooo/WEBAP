<style>
/* === Enhanced Editable User Information Card === */
.user_card {
  width: 480px;
  background: linear-gradient(145deg, var(--bg-white) 0%, #f8fafc 100%);
  padding: 2.5rem;
  border-radius: var(--border-radius);
  box-shadow: 
    0 8px 32px var(--shadow-light),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);
  font-family: inherit;
  color: var(--text-dark);
  border: 1px solid var(--border-light);
  position: relative;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
}

.user_card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
  border-radius: var(--border-radius) var(--border-radius) 0 0;
}

.user_card:hover {
  transform: translateY(-6px);
  box-shadow: 
    0 15px 40px var(--shadow-medium),
    0 5px 15px rgba(0, 0, 0, 0.05);
}

.user_card h2 {
  text-align: center;
  margin-bottom: 2rem;
  color: var(--primary-dark);
  font-size: 1.75rem;
  font-weight: 700;
  position: relative;
  padding-bottom: 1rem;
}

.user_card h2::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, var(--primary-color), transparent);
  border-radius: 2px;
}

.info_grid {
  display: flex;
  flex-direction: column;
  gap: 0.875rem;
  margin-bottom: 1.5rem;
}

.info_row {
  background: var(--bg-light);
  padding: 1rem 1.25rem;
  border-radius: var(--border-radius-small);
  font-size: 1rem;
  color: var(--text-medium);
  border: 1px solid transparent;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
  display: flex;
  align-items: center;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

.info_row::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--primary-color);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.info_row:hover {
  border-color: var(--border-light);
  background: white;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
}

.info_row.editing {
  background: #f0f9ff;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.info_row.editing::before {
  opacity: 1;
}

.info_row strong {
  color: var(--primary-dark);
  font-weight: 600;
  min-width: 160px;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.info_row strong::before {
  content: '•';
  color: var(--primary-color);
  font-size: 1.5rem;
  line-height: 1;
}

.info_row .value {
  flex: 1;
  word-break: break-word;
  padding: 0.25rem 0;
}

.info_row .editable-field {
  flex: 1;
  display: none;
}

.info_row.editing .value {
  display: none;
}

.info_row.editing .editable-field {
  display: block;
}

/* Form Elements */
.editable-field input,
.editable-field select {
  width: 100%;
  padding: 0.5rem 0.75rem;
  border: 2px solid var(--border-light);
  border-radius: 6px;
  font-size: 1rem;
  transition: all 0.2s ease;
  background: white;
  color: var(--text-dark);
}

.editable-field input:focus,
.editable-field select:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

/* Password field */
.info_row[data-field="password"] {
  background: linear-gradient(90deg, #fff5f5, var(--bg-light));
}

.info_row[data-field="password"]::after {
  content: '🔒';
  position: absolute;
  right: 1rem;
  opacity: 0.6;
  font-size: 0.9rem;
  z-index: 1;
}

/* Access Level badge */
.info_row[data-field="access-level"] .value {
  display: inline-flex;
  align-items: center;
  padding: 0.25rem 0.75rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 500;
}

/* Stations list styling */
.info_row[data-field="stations"] .value {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.station_badge {
  background: var(--bg-light);
  padding: 0.35rem 0.75rem;
  border-radius: 12px;
  font-size: 0.85rem;
  border: 1px solid var(--border-light);
  transition: all 0.2s ease;
}

/* Multi-select for stations */
.multi-select {
  width: 100%;
  max-height: 120px;
  overflow-y: auto;
  background: white;
  border: 2px solid var(--border-light);
  border-radius: 6px;
  padding: 0.5rem;
}

.multi-select label {
  display: flex;
  align-items: center;
  padding: 0.4rem 0.5rem;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.2s ease;
}

.multi-select label:hover {
  background: var(--bg-light);
}

.multi-select input {
  margin-right: 0.5rem;
  width: auto;
}

/* Action Buttons */
.card-actions {
  display: flex;
  gap: 1rem;
  justify-content: flex-end;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border-light);
}

.btn {
  padding: 0.75rem 1.5rem;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.3s ease;
  border: none;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 120px;
  justify-content: center;
}

.btn-approve {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: white;
}

.btn-approve:hover:not(:disabled) {
  background: linear-gradient(135deg, #059669 0%, #047857 100%);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
}

.btn-approve:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-cancel {
  background: var(--bg-light);
  color: var(--text-medium);
  border: 1px solid var(--border-light);
}

.btn-cancel:hover {
  background: #f3f4f6;
  transform: translateY(-2px);
}

.btn-save {
  background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
  color: white;
}

.btn-save:hover {
  background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
}

.btn-edit {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: white;
}

.btn-edit:hover {
  background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3);
}

/* Status Indicators */
.status-indicator {
  position: absolute;
  top: 1rem;
  right: 1rem;
  padding: 0.25rem 0.75rem;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.status-pending {
  background: #fef3c7;
  color: #92400e;
  border: 1px solid #fbbf24;
}

.status-approved {
  background: #d1fae5;
  color: #065f46;
  border: 1px solid #10b981;
}

.status-editing {
  background: #dbeafe;
  color: #1e40af;
  border: 1px solid #3b82f6;
}

/* Edit icons */
.edit-icon {
  opacity: 0;
  margin-left: 0.5rem;
  color: var(--text-light);
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 0.9rem;
}

.info_row:hover .edit-icon {
  opacity: 0.5;
}

.info_row:hover .edit-icon:hover {
  opacity: 1;
  color: var(--primary-color);
}
</style>

<div class="main_container">
  <div class="user_card">
    <!-- Status Indicator -->
    <div class="status-indicator status-pending" id="statusIndicator">
      Pending Approval
    </div>
    
    <h2>👤 User Information</h2>
    
    <div class="info_grid" id="userInfoGrid">
      <!-- Full Name -->
      <div class="info_row" data-field="full-name">
        <strong>Full Name</strong>
        <span class="value" id="fullNameValue">Johnathan Michael Doe</span>
        <div class="editable-field">
          <input type="text" id="fullNameInput" value="Johnathan Michael Doe">
        </div>
        <span class="edit-icon" onclick="editField('full-name')">✏️</span>
      </div>
      
      <!-- Username -->
      <div class="info_row" data-field="username">
        <strong>Username</strong>
        <span class="value" id="usernameValue">johnd</span>
        <div class="editable-field">
          <input type="text" id="usernameInput" value="johnd">
        </div>
        <span class="edit-icon" onclick="editField('username')">✏️</span>
      </div>
      
      <!-- Email -->
      <div class="info_row" data-field="email">
        <strong>Email Address</strong>
        <span class="value" id="emailValue">john.doe@example.com</span>
        <div class="editable-field">
          <input type="email" id="emailInput" value="john.doe@example.com">
        </div>
        <span class="edit-icon" onclick="editField('email')">✏️</span>
      </div>
      
      <!-- Password -->
      <div class="info_row" data-field="password">
        <strong>Password</strong>
        <span class="value" id="passwordValue">••••••••••</span>
        <div class="editable-field">
          <input type="password" id="passwordInput" placeholder="Enter new password">
        </div>
        <span class="edit-icon" onclick="editField('password')">✏️</span>
      </div>
      
      <!-- Access Level -->
      <div class="info_row" data-field="access-level">
        <strong>Access Level</strong>
        <span class="value" id="accessLevelValue">Administrator</span>
        <div class="editable-field">
          <select id="accessLevelSelect">
            <option value="Administrator">Administrator</option>
            <option value="Manager">Manager</option>
            <option value="Operator">Operator</option>
            <option value="Viewer">Viewer</option>
          </select>
        </div>
        <span class="edit-icon" onclick="editField('access-level')">✏️</span>
      </div>
      
      <!-- Assigned Stations -->
      <div class="info_row" data-field="stations">
        <strong>Assigned Stations</strong>
        <span class="value" id="stationsValue">
          <span class="station_badge">Station A</span>
          <span class="station_badge">Station B</span>
        </span>
        <div class="editable-field">
          <div class="multi-select" id="stationsSelect">
            <label>
              <input type="checkbox" value="Station A" checked> Station A
            </label>
            <label>
              <input type="checkbox" value="Station B" checked> Station B
            </label>
            <label>
              <input type="checkbox" value="Station C"> Station C
            </label>
            <label>
              <input type="checkbox" value="Station D"> Station D
            </label>
            <label>
              <input type="checkbox" value="Station E"> Station E
            </label>
          </div>
        </div>
        <span class="edit-icon" onclick="editField('stations')">✏️</span>
      </div>
    </div>
    
    <!-- Action Buttons -->
    <div class="card-actions" id="actionButtons">
      <button class="btn btn-approve" id="approveBtn" onclick="approveUser()">
        ✅ Approve User
      </button>
      <button class="btn btn-cancel" id="cancelBtn" onclick="cancelEdit()" style="display: none;">
        ❌ Cancel
      </button>
      <button class="btn btn-save" id="saveBtn" onclick="saveChanges()" style="display: none;">
        💾 Save Changes
      </button>
      <button class="btn btn-edit" id="editBtn" onclick="enableEditing()" style="display: none;">
        ✏️ Edit Information
      </button>
    </div>
  </div>
</div>

<script>
// State management
let isApproved = false;
let isEditing = false;
let originalData = {};

// Initialize original data
function initializeOriginalData() {
  originalData = {
    'full-name': document.getElementById('fullNameValue').textContent,
    'username': document.getElementById('usernameValue').textContent,
    'email': document.getElementById('emailValue').textContent,
    'password': document.getElementById('passwordValue').textContent,
    'access-level': document.getElementById('accessLevelValue').textContent,
    'stations': Array.from(document.querySelectorAll('#stationsValue .station_badge'))
                   .map(badge => badge.textContent)
  };
}

// Edit a specific field
function editField(fieldId) {
  if (!isApproved) {
    alert('Please approve the user first before editing information.');
    return;
  }
  
  const row = document.querySelector(`[data-field="${fieldId}"]`);
  if (!row.classList.contains('editing')) {
    // Exit any other editing mode first
    exitEditMode();
    
    row.classList.add('editing');
    isEditing = true;
    
    // Focus the input field
    const input = row.querySelector('input, select');
    if (input) input.focus();
    
    // Show save/cancel buttons
    document.getElementById('cancelBtn').style.display = 'flex';
    document.getElementById('saveBtn').style.display = 'flex';
    document.getElementById('editBtn').style.display = 'none';
  }
}

// Enable full editing mode
function enableEditing() {
  if (!isApproved) return;
  
  // Enter edit mode for all fields
  document.querySelectorAll('.info_row').forEach(row => {
    if (!row.classList.contains('editing')) {
      row.classList.add('editing');
    }
  });
  
  isEditing = true;
  
  // Update buttons
  document.getElementById('cancelBtn').style.display = 'flex';
  document.getElementById('saveBtn').style.display = 'flex';
  document.getElementById('editBtn').style.display = 'none';
  
  // Update status
  document.getElementById('statusIndicator').className = 'status-indicator status-editing';
  document.getElementById('statusIndicator').textContent = 'Editing';
}

// Exit edit mode
function exitEditMode() {
  document.querySelectorAll('.info_row').forEach(row => {
    row.classList.remove('editing');
  });
  
  isEditing = false;
  
  // Reset buttons
  document.getElementById('cancelBtn').style.display = 'none';
  document.getElementById('saveBtn').style.display = 'none';
  document.getElementById('editBtn').style.display = isApproved ? 'flex' : 'none';
  
  if (isApproved) {
    document.getElementById('statusIndicator').className = 'status-indicator status-approved';
    document.getElementById('statusIndicator').textContent = 'Approved';
  }
}

// Cancel editing
function cancelEdit() {
  if (confirm('Discard all changes?')) {
    // Restore original values
    document.getElementById('fullNameInput').value = originalData['full-name'];
    document.getElementById('usernameInput').value = originalData['username'];
    document.getElementById('emailInput').value = originalData['email'];
    document.getElementById('passwordInput').value = '';
    document.getElementById('accessLevelSelect').value = originalData['access-level'];
    
    // Restore stations
    document.querySelectorAll('#stationsSelect input[type="checkbox"]').forEach(checkbox => {
      checkbox.checked = originalData['stations'].includes(checkbox.value);
    });
    
    exitEditMode();
  }
}

// Save changes
function saveChanges() {
  // Update display values
  document.getElementById('fullNameValue').textContent = document.getElementById('fullNameInput').value;
  document.getElementById('usernameValue').textContent = document.getElementById('usernameInput').value;
  document.getElementById('emailValue').textContent = document.getElementById('emailInput').value;
  
  // Update password (only if changed)
  const newPassword = document.getElementById('passwordInput').value;
  if (newPassword.trim()) {
    document.getElementById('passwordValue').textContent = '•'.repeat(10);
  }
  
  // Update access level
  const accessLevel = document.getElementById('accessLevelSelect').value;
  document.getElementById('accessLevelValue').textContent = accessLevel;
  
  // Update stations
  const selectedStations = Array.from(document.querySelectorAll('#stationsSelect input[type="checkbox"]:checked'))
    .map(checkbox => checkbox.value);
  
  const stationsContainer = document.getElementById('stationsValue');
  stationsContainer.innerHTML = '';
  selectedStations.forEach(station => {
    const badge = document.createElement('span');
    badge.className = 'station_badge';
    badge.textContent = station;
    stationsContainer.appendChild(badge);
  });
  
  // Update original data
  initializeOriginalData();
  
  // Exit edit mode
  exitEditMode();
  
  // Show success message
  showNotification('Changes saved successfully!', 'success');
}

// Approve user
function approveUser() {
  if (confirm('Approve this user? This will enable editing of their information.')) {
    isApproved = true;
    
    // Update status indicator
    const statusIndicator = document.getElementById('statusIndicator');
    statusIndicator.className = 'status-indicator status-approved';
    statusIndicator.textContent = 'Approved';
    
    // Update buttons
    document.getElementById('approveBtn').disabled = true;
    document.getElementById('approveBtn').innerHTML = '✅ Approved';
    document.getElementById('editBtn').style.display = 'flex';
    
    // Store original data for cancel functionality
    initializeOriginalData();
    
    // Show success message
    showNotification('User approved successfully! You can now edit their information.', 'success');
  }
}

// Notification system
function showNotification(message, type) {
  // Remove existing notification
  const existingNotification = document.querySelector('.notification');
  if (existingNotification) {
    existingNotification.remove();
  }
  
  // Create notification
  const notification = document.createElement('div');
  notification.className = `notification notification-${type}`;
  notification.textContent = message;
  notification.style.cssText = `
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 1rem 1.5rem;
    background: ${type === 'success' ? '#10b981' : '#ef4444'};
    color: white;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    z-index: 1000;
    animation: slideIn 0.3s ease;
  `;
  
  document.body.appendChild(notification);
  
  // Auto-remove after 3 seconds
  setTimeout(() => {
    notification.style.animation = 'slideOut 0.3s ease';
    setTimeout(() => notification.remove(), 300);
  }, 3000);
}

// Add CSS animations for notifications
if (!document.querySelector('#notification-styles')) {
  const style = document.createElement('style');
  style.id = 'notification-styles';
  style.textContent = `
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }
  `;
  document.head.appendChild(style);
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
  // Hide edit button initially
  document.getElementById('editBtn').style.display = 'none';
});
</script>
